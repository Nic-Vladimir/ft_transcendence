services:
  frontend:
    build: ./nextApp
    container_name: frontend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - transnet
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

  nginx:
    build: ./gateway/nginx
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
    networks:
      - transnet
    restart: on-failure

  database:
    image: postgres:16
    container_name: database
    volumes:
      - db-volume:/var/lib/postgresql/data
    networks:
      - transnet
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-volume:
    driver: local

  frontend-data:
    driver: local

networks:
  transnet:
    driver: bridge
